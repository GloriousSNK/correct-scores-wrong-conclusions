# Cheap first-pass config: validates the live Azure path for a few dollars in
# ~20-30 min before committing to the full sweep in config.yaml.
# Reduced scope: 5 trajectories/cell, coords-only, no_cot only.
# Outputs go to results/firstpass/* so they DON'T collide with the full run.
dataset:
  systems: [1, 2, 3]
  trajectories_per_cell: 5
  ground_truth_dt: 0.001
  total_seconds: 65
  pre_context_seconds: 10.0
  seed: 42

regimes:
  normal:
    g: 9.81
    L: [1.0]
    m: [1.0]
    damping: 0.0
  changed_disclosed:
    g: 3.71
    L: [1.4, 0.7, 1.1]
    m: [2.0, 0.6, 1.5]
    damping: 0.05
  changed_hidden:
    g: 1.62
    L: [0.8, 1.2, 0.9]
    m: [0.5, 1.8, 1.0]
    damping: 0.1

initial_conditions:
  theta_low: -3.0
  theta_high: 3.0
  omega_low: -1.0
  omega_high: 1.0

horizons_seconds: [0.01, 1.0, 10.0, 60.0]

# coords-only keeps cost down and works for non-vision models too.
modalities: [coords]

# no_cot only: avoids the expensive CoT output tokens for a first pass.
prompting: [no_cot]

rendering:
  image_size: [512, 512]
  fps: 30
  background: "#0a0a0a"
  grid: true
  show_trail: false

azure:
  api_version: "2024-08-01-preview"   # unused on the OpenAI /openai/v1 route
  # Reasoning models (grok-4-1-fast-reasoning) take ~37s/call and occasionally
  # much longer on hard long-horizon cells; 300s avoids spurious timeouts.
  request_timeout: 300
  # Lower retries so a genuinely-stuck cell can't burn N x timeout of wall-clock.
  max_retries: 2

models:
  # gpt-5.5 is DEPLOYED-BLOCKED: subscription has 0 TPM quota for every gpt-5.x
  # SKU in eastus. Re-enable after a quota-increase request is granted, then
  # `az cognitiveservices account deployment create ... --model-name gpt-5.5`.
  # - name: gpt-5.5
  #   kind: llm
  #   deployment: gpt-5.5
  #   vision: true
  #   concurrency: 6
  - name: kimi-k2.6
    kind: llm
    deployment: kimi-k2.6
    vision: false
    concurrency: 6
  # Llama-4-Maverick substitutes the unavailable qwen3-vl-32b slot (real VLM).
  - name: llama-4-maverick
    kind: llm
    deployment: llama-4-maverick
    vision: true
    concurrency: 6
  - name: grok-4-1-fast-reasoning
    kind: llm
    deployment: grok-4-1-fast-reasoning
    vision: true
    concurrency: 6

  - name: euler
    kind: numerical
    method: euler
    step: 0.01
  - name: rk4
    kind: numerical
    method: rk4
    step: 0.01
  - name: symplectic
    kind: numerical
    method: leapfrog
    step: 0.01

paths:
  results_dir: results/firstpass
  checkpoints_dir: results/firstpass/checkpoints
  raw_dir: results/firstpass/raw
  summary_dir: results/firstpass/summary
  dataset_dir: results/firstpass/dataset
  renders_dir: results/firstpass/renders

metrics:
  divergence_threshold_rad: 0.5
  divergence_threshold_xy: 0.5
