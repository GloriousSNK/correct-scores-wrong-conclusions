dataset:
  systems: [1, 2, 3]
  trajectories_per_cell: 20
  ground_truth_dt: 0.001
  total_seconds: 65
  pre_context_seconds: 10.0
  seed: 42

regimes:
  normal:
    g: 9.81
    L: [1.0]
    m: [1.0]
    damping: 0.0
  changed_disclosed:
    g: 3.71
    L: [1.4, 0.7, 1.1]
    m: [2.0, 0.6, 1.5]
    damping: 0.05
  changed_hidden:
    g: 1.62
    L: [0.8, 1.2, 0.9]
    m: [0.5, 1.8, 1.0]
    damping: 0.1

initial_conditions:
  theta_low: -3.0
  theta_high: 3.0
  omega_low: -1.0
  omega_high: 1.0

horizons_seconds: [0.01, 1.0, 10.0, 60.0]

modalities: [coords, images, images_coords]

prompting: [no_cot, cot]

rendering:
  image_size: [512, 512]
  fps: 30
  background: "#0a0a0a"
  grid: true
  show_trail: false

azure:
  api_version: "2024-08-01-preview"
  request_timeout: 120
  max_retries: 4

nim:
  base_url: "https://integrate.api.nvidia.com/v1"
  request_timeout: 120
  max_retries: 4

models:
  # GPT-5.5: deferred to next round (requires AWS Bedrock — no AWS this round)
  # - name: gpt-5.5
  #   kind: llm
  #   deployment: gpt-5.5
  #   vision: true
  #   concurrency: 6

  - name: kimi-k2.6
    kind: llm
    deployment: kimi-k2.6
    vision: false
    concurrency: 6
    max_tokens: 65536      # kimi burns ~10-13k tokens on chain-of-thought; 16k cap causes truncation before answer
    request_timeout: 300   # kimi takes 2-4 min per cell at 20k+ output tokens; 120s global default times out

  - name: deepseek-v4-pro
    kind: llm
    deployment: deepseek-v4-pro
    vision: true  # was false — model supports vision; image cells failed because of this flag, not capability
    concurrency: 6

  # qwen: deferred to next round (requires AWS Bedrock — no AWS this round)
  # - name: qwen
  #   kind: llm
  #   deployment: qwen-qwen3-vl-32b-reasoning
  #   vision: true
  #   concurrency: 6

  - name: grok-4-1-fast-reasoning
    kind: llm
    deployment: grok-4-1-fast-reasoning
    vision: true
    concurrency: 6

  # llama-4-maverick: dropped after firstpass run (119/180 success, 61 failures).
  # Root cause: sustained 429 RateLimitReached errors mid-run on Azure AI Foundry;
  # no per-model rate-limit increase was available at the time. The 61 failed cells
  # are systematically missing (not random), so partial results cannot be used safely.
  # Firstpass results preserved in results/firstpass/checkpoints/ for reference.
  # - name: llama-4-maverick
  #   kind: llm
  #   deployment: llama-4-maverick
  #   vision: false
  #   concurrency: 6

  - name: euler
    kind: numerical
    method: euler
    step: 0.01
  - name: rk4
    kind: numerical
    method: rk4
    step: 0.01
  - name: symplectic
    kind: numerical
    method: leapfrog
    step: 0.01

  # Learned dynamics models — weights must be trained first via:
  #   python scripts/train_learned.py --output-dir results/learned_models
  # or submitted as an Azure ML job via scripts/azure_ml_job.py
  - name: neural-ode
    kind: learned
    variant: neural_ode
    checkpoint: results/learned_models/neural_ode.pt
  - name: hnn
    kind: learned
    variant: hnn
    checkpoint: results/learned_models/hnn.pt
  - name: lnn
    kind: learned
    variant: lnn
    checkpoint: results/learned_models/lnn.pt
    hidden: 64
    layers: 2

  # Time-series models: disabled until Azure ML endpoints are deployed.
  # - name: chronos
  #   kind: timeseries
  #   variant: chronos
  #   max_prediction_length: 256
  #   concurrency: 4
  # - name: timesfm
  #   kind: timeseries
  #   variant: timesfm
  #   max_prediction_length: 256
  #   concurrency: 4
  # - name: moirai
  #   kind: timeseries
  #   variant: moirai
  #   max_prediction_length: 256
  #   concurrency: 4

paths:
  results_dir: results
  checkpoints_dir: results/checkpoints
  raw_dir: results/raw
  summary_dir: results/summary
  dataset_dir: results/dataset
  renders_dir: results/renders
  learned_models_dir: results/learned_models

metrics:
  divergence_threshold_rad: 0.5
  divergence_threshold_xy: 0.5
